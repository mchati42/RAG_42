[project]
name = "rag_system"
version = "0.1.0"
description = "A Retrieval-Augmented Generation system"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.0",
    "rank-bm25>=0.2.2",
    "tqdm>=4.65",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
managed = true
